<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Criar Chamado - Sistema Integrado</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="sidebar">
        <div class="logo">
            <img src="imag/logo.png" alt="Logo da Prefeitura">
        </div>
        <nav>
            <ul>
                <li><a href="server_menu.html">Menu</a></li>
                <li><a href="criar_chamado.html" class="active">Criar Chamado</a></li>
                <li><a href="ver_chamados.html">Ver Chamados</a></li>
                <li><a href="alterar_senha.html">Alterar Senha</a></li>
                <li><a href="login.html">Sair</a></li>
            </ul>
        </nav>
    </div>
    <div class="content">
        <div class="breadcrumb">Você está em: Criar Chamado</div>
        <h1>Novo Chamado</h1>
        <form id="form-chamado" action="backend/criar_chamado.php" method="POST" onsubmit="return enviarChamado(event)">
            <label for="assunto">Assunto:</label>
            <input type="text" id="assunto" name="assunto" required>
            <label for="descricao">Descrição do Problema:</label>
            <textarea id="descricao" name="descricao" required></textarea>
            <button type="submit">Enviar Chamado</button>
        </form>
        <div id="chamado-feedback" style="display:none; margin-top:20px; text-align:center;"></div>
    </div>
    <script>
        function enviarChamado(event) {
            event.preventDefault();
            const form = document.getElementById('form-chamado');
            const data = new FormData(form);
            fetch(form.action, {
                method: 'POST',
                body: data,
                credentials: 'include'
            })
                .then(r => r.json())
                .then(resp => {
                    if (resp.success) {
                        form.style.display = 'none';
                        document.getElementById('chamado-feedback').style.display = 'block';
                        document.getElementById('chamado-feedback').innerHTML = '<span class="success">Chamado enviado com sucesso!</span>';
                    } else {
                        document.getElementById('chamado-feedback').style.display = 'block';
                        document.getElementById('chamado-feedback').innerHTML = '<span class="alert">' + (resp.message || 'Erro ao enviar chamado') + '</span>';
                    }
                })
                .catch(() => {
                    document.getElementById('chamado-feedback').style.display = 'block';
                    document.getElementById('chamado-feedback').innerHTML = '<span class="alert">Erro de conexão com o sistema central.</span>';
                });
            return false;
        }
    </script>
</body>

</html>
